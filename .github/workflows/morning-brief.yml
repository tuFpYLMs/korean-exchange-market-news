name: KRX Morning Brief

on:
  schedule:
    # 23:00 UTC = 08:00 KST next day (before KRX opens at 09:00 KST)
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      model:
        description: 'Model to use'
        required: true
        default: 'deepseek-ai/deepseek-v4-pro'
        type: choice
        options:
          - deepseek-ai/deepseek-v4-pro
          - deepseek-ai/deepseek-v4-flash

env:
  MODEL_NAME: ${{ inputs.model || 'deepseek-ai/deepseek-v4-pro' }}

jobs:
  generate-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 duckduckgo-search

      - name: Generate Morning Brief
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MODEL_NAME: ${{ env.MODEL_NAME }}
        run: |
          python3 .github/scripts/generate_brief.py

      - name: Commit and push brief
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add briefs/
          git diff --cached --quiet || git commit -m "Morning Brief: $(date -u +%Y-%m-%d) via ${{ env.MODEL_NAME }}"
          git push
