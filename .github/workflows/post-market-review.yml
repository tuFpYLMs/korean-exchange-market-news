name: KRX Post-Market Review

on:
  schedule:
    # 06:30 UTC = 15:30 KST (after KRX closes at 15:30 KST)
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      model:
        description: 'Model to use'
        required: true
        default: 'nvidia/deepseek-ai/deepseek-v4-pro'
        type: choice
        options:
          - nvidia/deepseek-ai/deepseek-v4-pro
          - nvidia/deepseek-ai/deepseek-v4-flash

env:
  MODEL_NAME: ${{ inputs.model || 'nvidia/deepseek-ai/deepseek-v4-pro' }}
  SLUG: ${{ inputs.model == 'nvidia/deepseek-ai/deepseek-v4-flash' && 'dsv4flash' || 'dsv4pro' }}

jobs:
  generate-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install OpenCode
        run: npm install -g opencode

      - name: Generate Post-Market Review via OpenCode
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export MODEL="${{ env.MODEL_NAME }}"
          export SLUG="${{ env.SLUG }}"
          export DATE="$(date -u +%Y-%m-%d)"
          
          # Create prompt with context
          cat > /tmp/opencode_prompt.txt << 'PROMPT'
          You are a senior macro and equity trading desk analyst at a top-tier Korean securities firm.

          Your task: Write a professional KRX Post-Market Review analyzing today's trading session.

          ## Requirements
          - Target audience: Fund managers, hedge funds, prop traders
          - Tone: Professional, concise, actionable — no fluff
          - Data: Use real-time market data via web search and web fetch
          - Length: ~2,000–3,000 words
          - Confidence score: 1–10 (be honest)

          ## Structure
          1. **Session Summary** — KOSPI/KOSDAQ close, change %, volume, vs. morning call accuracy
          2. **Foreign Flow Analysis** — Net buy/sell by foreigners, institutions, retail; key sectors
          3. **Sector Performance** — Best/worst performing sectors and why
          4. **Key Stock Moves** — Notable movers (Samsung, SK Hynix, EV battery, biotech, etc.)
          5. **Macro Drivers Today** — What moved markets (Fed, earnings, geopolitical, FX)
          6. **Overnight Preview** — US/Europe expectations; key events to watch
          7. **Tomorrow's Setup** — Early read on next session; key levels and catalysts
          8. **Trading Desk Notes** — Any unusual flows, block trades, or positioning changes

          ## Data Sources to Check
          - KOSPI, KOSDAQ close levels and change %
          - USD/KRW close level
          - Foreigner net buy/sell data
          - Top gainers/losers on KRX
          - Sector index performance
          - US futures (S&P, Nasdaq, Dow) for overnight context
          - Any breaking news from Korea or affecting Korea

          ## Output
          Write the review in Markdown format. Save to reviews/{DATE}-{SLUG}.md where DATE is today's UTC date (YYYY-MM-DD) and SLUG is the model identifier.

          After writing, commit the file with message "Post-Market Review: {DATE} ({SLUG})" and push to a new branch, then create a pull request.
          PROMPT
          
          # Run OpenCode with the prompt
          opencode --model "$MODEL" --prompt "$(cat /tmp/opencode_prompt.txt)"

      - name: Verify review created
        run: |
          ls -la reviews/${DATE}-${SLUG}.md || echo "Review not found - check OpenCode logs"
