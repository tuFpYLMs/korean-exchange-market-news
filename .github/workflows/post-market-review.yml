name: KRX Post-Market Review

on:
  schedule:
    # 06:30 UTC = 15:30 KST (after KRX closes)
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      model:
        description: 'Model to use'
        required: true
        default: 'deepseek-ai/deepseek-v4-pro'
        type: choice
        options:
          - deepseek-ai/deepseek-v4-pro
          - deepseek-ai/deepseek-v4-flash

env:
  MODEL_NAME: ${{ inputs.model || 'deepseek-ai/deepseek-v4-pro' }}

jobs:
  generate-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 duckduckgo-search

      - name: Run date gate check
        id: gate
        run: |
          python3 scripts/review_gate.py
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Generate Post-Market Review
        if: steps.gate.outputs.exit_code == '0'
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MODEL_NAME: ${{ env.MODEL_NAME }}
        run: |
          python3 .github/scripts/generate_review.py

      - name: Commit and push review
        if: steps.gate.outputs.exit_code == '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add reviews/
          git diff --cached --quiet || git commit -m "Post-market review: $(date -u +%Y-%m-%d) via ${{ env.MODEL_NAME }}"
          git push
